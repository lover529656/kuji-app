<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>くじアプリ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align:center; font-family:sans-serif;">

  <h1>あなたは？</h1>
  <button onclick="draw()">くじを引く</button>

  <h2 id="result"></h2>

  <script>
    async function main() {
      await liff.init({ liffId: "ここにLIFF ID貼る" });

      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }

    function draw() {
      const rand = Math.random();
      if (rand < 0.3) {
        document.getElementById("result").innerText = "🎉 当たり";
      } else {
        document.getElementById("result").innerText = "はずれ…";
      }
    }

    main();
  </script>

</body>
</html>
