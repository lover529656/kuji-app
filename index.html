<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くじアプリ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  margin: 0;
  background: #f2b45c;
  font-family: sans-serif;
  text-align: center;
}

.container {
  padding: 20px;
}

.hidden {
  display: none;
}

/* ボタン */
.btn {
  width: 80%;
  margin: 10px auto;
  padding: 20px;
  font-size: 22px;
  border-radius: 12px;
  background: #eee;
  border: none;
}

/* 入力 */
input {
  font-size: 20px;
  padding: 8px;
  margin: 5px;
  width: 120px;
}

/* 結果 */
.result {
  font-size: 50px;
  margin: 20px;
  color: #ff6a3d;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

  <!-- メニュー -->
  <div id="menu">
    <h2>モード選択</h2>
    <button class="btn" onclick="show('lottery')">当たり/はずれ</button>
    <button class="btn" onclick="show('number')">番号割り振り</button>
  </div>

  <!-- 当たり/はずれ -->
  <div id="lottery" class="hidden">
    <h2>当たり/はずれ</h2>

    <div>
      母数<br>
      <input id="total1" type="number" value="525">
    </div>

    <div>
      当たり人数<br>
      <input id="winCount" type="number" value="100">
    </div>

    <button class="btn" onclick="drawLottery()">抽選</button>

    <div id="lotteryResult" class="result">？</div>

    <button onclick="back()">戻る</button>
  </div>

  <!-- 番号割り振り -->
  <div id="number" class="hidden">
    <h2>番号割り振り</h2>

    <div>
      母数<br>
      <input id="total2" type="number" value="525">
    </div>

    <button class="btn" onclick="drawNumber()">番号取得</button>

    <div id="numberResult" class="result">？</div>

    <button onclick="back()">戻る</button>
  </div>

</div>

<script>
const LIFF_ID = "YOUR_LIFF_ID";

/* 画面切替 */
function show(mode) {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById(mode).classList.remove("hidden");
}

function back() {
  document.getElementById("menu").classList.remove("hidden");
  document.getElementById("lottery").classList.add("hidden");
  document.getElementById("number").classList.add("hidden");
}

/* 抽選 */
function drawLottery() {
  const total = Number(document.getElementById("total1").value);
  const win = Number(document.getElementById("winCount").value);

  const rand = Math.floor(Math.random() * total);

  if (rand < win) {
    document.getElementById("lotteryResult").innerText = "当たり";
  } else {
    document.getElementById("lotteryResult").innerText = "はずれ";
  }
}

/* 番号割り振り */
function drawNumber() {
  const total = Number(document.getElementById("total2").value);

  const num = Math.floor(Math.random() * total) + 1;

  document.getElementById("numberResult").innerText = num + "番";
}

/* LIFF */
async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) liff.login();
  } catch (e) {
    console.log(e);
  }
}

initLiff();
</script>

</body>
</html>
