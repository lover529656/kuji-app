<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くじ</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body {
  margin: 0;
  background: #f3b15a;
  font-family: sans-serif;
  text-align: center;
}

/* 上の枠 */
.box {
  margin: 40px auto;
  width: 80%;
  background: #e6e0d5;
  border-radius: 10px;
  padding: 30px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

/* 数字 */
.number {
  font-size: 80px;
  color: #ff8a4d;
  font-weight: bold;
}

/* 中央テキスト */
.sub {
  font-size: 40px;
  color: #ddd;
}

/* ボタン */
.button {
  margin-top: 40px;
  background: #e6e0d5;
  padding: 20px;
  border-radius: 20px;
  font-size: 40px;
  color: #ff8a4d;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<div class="box">
  <div id="result" class="number">あなたは？</div>
</div>

<div class="sub">/525 人中</div>

<div class="button" onclick="draw()">あなたは？</div>

<script>
async function main() {
  await liff.init({ liffId: "ここにLIFF ID" });
  if (!liff.isLoggedIn()) liff.login();
}

function draw() {
  const rand = Math.random();
  if (rand < 0.3) {
    document.getElementById("result").innerText = "当たり！";
  } else {
    document.getElementById("result").innerText = "はずれ";
  }
}

main();
</script>

</body>
</html>
